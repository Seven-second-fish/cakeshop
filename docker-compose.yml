version: "3.8"
services:
  mysql:
    image: mysql:5.7
    container_name: cakeshop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cake_shop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./cake_shop.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: ["--character-set-server=utf8", "--collation-server=utf8_general_ci"]

  app:
    build: .
    container_name: cakeshop-app
    depends_on:
      - mysql
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:


